<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | SCFMS</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="login-body">
  <div class="bg-particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>

  <div class="login-container" style="max-width:520px;">
    <div class="login-header">
      <div class="logo-icon"><i class="fas fa-user-plus"></i></div>
      <h1>Create Student Account</h1>
      <p class="subtitle">Pillai HOC Polytechnic – SCFMS Portal</p>
    </div>

    <div id="alertBox" class="alert hidden"></div>

    <div class="login-card">
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label><i class="fas fa-user"></i> Full Name</label>
            <input type="text" id="fullName" placeholder="Enter full name" required/>
          </div>
          <div class="form-group">
            <label><i class="fas fa-id-card"></i> Roll No</label>
            <input type="text" id="rollNo" placeholder="e.g. 2511001" required/>
          </div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="Enter college email" required/>
        </div>
        <div class="form-row" style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
          <div class="form-group">
            <label><i class="fas fa-code-branch"></i> Branch</label>
            <select id="branch" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:white; padding:12px; width:100%;">
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Electronics Engineering">Electronics Engineering</option>
            </select>
          </div>
          <div class="form-group">
            <label><i class="fas fa-layer-group"></i> Semester</label>
            <select id="semester" style="background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:10px; color:white; padding:12px; width:100%;">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6"/>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat your password" required/>
        </div>
        <button type="submit" class="btn-primary btn-full">
          <i class="fas fa-user-plus"></i> Register
        </button>
      </form>
      <div class="register-link" style="margin-top:16px;">
        Already have an account? <a href="index.html">Login here</a>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function handleRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirmPassword').value;
      if (password !== confirm) { showAlert('Passwords do not match!', 'error'); return; }
      const result = registerStudent({
        name:     document.getElementById('fullName').value.trim(),
        rollNo:   document.getElementById('rollNo').value.trim(),
        email:    document.getElementById('email').value.trim(),
        branch:   document.getElementById('branch').value,
        semester: document.getElementById('semester').value,
        password
      });
      if (result.success) {
        showAlert('Account created successfully! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'index.html', 1500);
      } else {
        showAlert(result.message, 'error');
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = 'alert ' + type;
      setTimeout(() => box.className = 'alert hidden', 4000);
    }
  </script>
</body>
</html>
